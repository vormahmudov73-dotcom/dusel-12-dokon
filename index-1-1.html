<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>DUSEL 12-DOKON</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#101820;--panel:#1c2a38;--line:#35495b;--red:#df2028;--muted:#aab7c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;padding-bottom:85px}header{position:sticky;top:0;background:#101820f5;padding:14px 15px;z-index:3;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:50%;background:#d71920;display:grid;place-items:center;font-weight:900}.title{font-size:18px;font-weight:800}.muted{font-size:12px;color:var(--muted);margin-top:4px}input{width:100%;margin-top:13px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;color:white;font-size:15px;outline:none}main{padding:15px}.hero{padding:18px;border-radius:18px;background:linear-gradient(130deg,#30475d,#1a2937);margin-bottom:15px}.hero h1{margin:0 0 7px;font-size:22px}.hero p{margin:0;color:#c2ced9;font-size:13px;line-height:1.45}.brands{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 0}.brands button,.nav{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:white;padding:11px 4px;font-weight:bold}.brands .active,.add,.primary{background:var(--red);border-color:var(--red)}.bar{display:flex;justify-content:space-between;align-items:center;margin:17px 0 10px}.bar h2{font-size:17px;margin:0}.bar span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:var(--panel);border:1px solid #2d4051;border-radius:15px;overflow:hidden}.photo{height:135px;background:#263a4c;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:45px}.info{padding:10px}.tag{font-size:10px;color:#f2c75b;font-weight:bold}.name{font-size:13px;font-weight:bold;line-height:1.35;min-height:35px;margin:6px 0}.variant{font-size:11px;color:var(--muted);min-height:14px}.price{font-size:17px;font-weight:900;margin:9px 0}.add{width:100%;border:0;border-radius:9px;color:white;padding:10px;font-weight:bold}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px 10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#111c27;border-top:1px solid var(--line);display:flex;gap:9px;padding:10px 13px calc(10px + env(safe-area-inset-bottom));z-index:4}.nav{flex:1;padding:13px}.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:6;align-items:flex-end}.sheet{background:#172431;border-radius:20px 20px 0 0;padding:19px;width:100%;max-height:80vh;overflow:auto}.cartrow{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.qty{display:flex;gap:7px;align-items:center}.qty button{background:#30465a;color:white;border:0;padding:6px 10px;border-radius:8px}.total{text-align:right;font-size:19px;font-weight:bold;margin:16px 0}.toast{display:none;position:fixed;bottom:80px;left:15px;right:15px;background:#2b4053;padding:12px;border-radius:11px;text-align:center;z-index:9}@media(min-width:700px){main{max-width:950px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}.photo{height:180px}}
</style></head><body>
<header><div class="top"><div class="logo">D</div><div><div class="title">DUSEL 12-DOKON</div><div class="muted">Elektr mahsulotlari katalogi</div></div></div><input id="q" type="search" placeholder="🔎 Mahsulot, model yoki kodni qidiring..."></header>
<main><section class="hero"><h1>Mahsulotlar katalogi</h1><p>Rasmlarni ko‘ring, narxlarni solishtiring va kerakli mahsulotlarni savatga qo‘shing.</p></section><div class="brands" id="brands"><button class="active" data-brand="ALL">Barchasi</button><button data-brand="DUSEL">DUSEL</button><button data-brand="VERAL">VERAL</button><button data-brand="SALID">SALID</button></div><div class="bar"><h2 id="heading">Mahsulotlar</h2><span id="count">Yuklanmoqda...</span></div><div class="grid" id="products"><div class="empty">Katalog yuklanmoqda...</div></div></main>
<div class="bottom"><button class="nav" id="home">⌂ Katalog</button><button class="nav primary" id="cartBtn">🛒 Savat <b id="cartCount">0</b></button></div><div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="sheet"><h2>🛒 Savatingiz <button id="close" style="float:right;background:none;color:white;border:0;font-size:23px">×</button></h2><div id="cartItems"></div><div class="total" id="total">Jami: $0.00</div><button class="nav primary" id="checkout" style="width:100%">Buyurtma berish</button></div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.setHeaderColor('#101820');tg.setBackgroundColor('#101820')}
let products=[],brand='ALL',cart={};const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '$'+Number(n||0).toFixed(2)}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
function render(){let q=$('q').value.trim().toLocaleLowerCase();let list=products.filter(p=>(brand==='ALL'||p.brand===brand)&&(!q||(p.name+' '+p.brand+' '+p.section+' '+p.variant).toLocaleLowerCase().includes(q)));$('count').textContent=list.length+' ta';$('heading').textContent=brand==='ALL'?'Mahsulotlar':brand+' mahsulotlari';$('products').innerHTML=list.slice(0,500).map((p,i)=>`<article class="card"><div class="photo">${p.image?`<img loading="lazy" src="${p.image}" onerror="this.style.display='none'">`:'<span class="placeholder">💡</span>'}</div><div class="info"><div class="tag">${esc(p.brand)} · ${esc(p.section)}</div><div class="name">${esc(p.name)}</div><div class="variant">${esc(p.variant||'')}</div><div class="price">${money(p.price)}</div><button class="add" data-i="${i}">＋ Savatga</button></div></article>`).join('')||'<div class="empty">Mahsulot topilmadi</div>';$('products').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let p=list[+b.dataset.i],k=p.brand+'|'+p.section+'|'+p.name;cart[k]??={...p,qty:0};cart[k].qty++;update();toast('Savatga qo‘shildi')})}
function update(){$('cartCount').textContent=Object.values(cart).reduce((n,p)=>n+p.qty,0)}
function showCart(){let rows=Object.entries(cart);$('cartItems').innerHTML=rows.map(([k,p])=>`<div class="cartrow"><div><b>${esc(p.name)}</b><br><small>${esc(p.brand)} · ${money(p.price)}</small></div><div class="qty"><button data-dec="${esc(k)}">−</button>${p.qty}<button data-inc="${esc(k)}">＋</button></div></div>`).join('')||'<p>Savat bo‘sh.</p>';$('total').textContent='Jami: '+money(rows.reduce((n,[k,p])=>n+p.qty*p.price,0));$('overlay').style.display='flex';$('cartItems').querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{let p=cart[b.dataset.dec];if(--p.qty<=0)delete cart[b.dataset.dec];update();showCart()});$('cartItems').querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart[b.dataset.inc].qty++;update();showCart()})}
$('q').oninput=render;$('brands').querySelectorAll('button').forEach(b=>b.onclick=()=>{brand=b.dataset.brand;$('brands').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});$('home').onclick=()=>{brand='ALL';$('q').value='';render()};$('cartBtn').onclick=showCart;$('close').onclick=()=>$('overlay').style.display='none';$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').style.display='none'};$('checkout').onclick=()=>{let items=Object.values(cart).map(p=>({brand:p.brand,section:p.section,name:p.name,qty:p.qty}));if(!items.length)return toast('Savat bo‘sh');if(!tg)return toast('Telegram ichida oching');tg.sendData(JSON.stringify({type:'order',items}));toast('Buyurtma botga yuborildi');cart={};update();$('overlay').style.display='none'};
fetch('/api/catalog').then(r=>r.json()).then(d=>{products=d.products||[];render()}).catch(()=>$('products').innerHTML='<div class="empty">Katalog yuklanmadi. Internetni tekshiring.</div>');
</script></body></html>
