<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALID — Mahsulotlar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d0f;color:#f3f3f3;font-family:Inter,Arial,sans-serif}
.top{height:72px;border-bottom:1px solid #24272b;display:flex;align-items:center;padding:0 24px;gap:28px;position:sticky;top:0;background:#0b0d0fee;backdrop-filter:blur(12px);z-index:10}
.logo{font-size:31px;font-weight:800;color:#e2b54f;letter-spacing:1px;width:190px}.search{width:340px;background:#171a1e;border:1px solid #272b30;border-radius:28px;padding:13px 18px;color:#aaa;font-size:15px;outline:none}.top-right{margin-left:auto;display:flex;gap:22px;align-items:center;color:#aaa}.avatar{width:38px;height:38px;border-radius:50%;background:#9b762b;color:#fff;display:grid;place-items:center;font-weight:700}
.layout{display:flex;min-height:calc(100vh - 72px)}.side{width:228px;border-right:1px solid #24272b;padding:22px 12px;position:fixed;top:72px;bottom:0;background:#0b0d0f}.nav{padding:13px 15px;border-radius:10px;color:#c8c8c8;margin:4px 0}.nav.active{background:#5b4319;color:#f2c766}.nav small{display:block;padding:11px 18px;color:#b8b8b8}.main{margin-left:228px;padding:25px 20px;width:calc(100% - 228px)}.crumb{color:#888;font-size:14px;margin-bottom:18px}.hero{display:flex;align-items:center;gap:18px}.brandbox{width:185px;height:88px;border-radius:6px;background:#050505;display:grid;place-items:center;color:#d8a63d;font-size:24px;font-weight:800}.hero h1{font-size:29px;margin:0 0 4px}.hero p{margin:0;color:#aaa}.actions{margin-left:auto;display:flex;gap:10px}.btn{border:1px solid #34383d;background:#171a1e;color:#eee;padding:11px 18px;border-radius:8px}.btn.danger{background:#c92e2e;border-color:#df4444}.cats{display:flex;gap:11px;overflow:auto;margin:17px 0}.cat{white-space:nowrap;padding:12px 21px;border-radius:8px;background:#15181c;border:1px solid #282c31}.cat.active{background:#d3a03d;color:#111;border-color:#e1b553}.grid{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:12px}.card{background:#15181b;border:1px solid #292d31;border-radius:10px;padding:5px 5px 9px;min-width:0}.pic{height:112px;border-radius:7px;background:linear-gradient(135deg,#eee,#c9c9c9);display:grid;place-items:center;color:#a47b27;font-size:18px;font-weight:800;overflow:hidden}.product-img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:7px}.pic span{background:#fff;padding:5px 9px;border-radius:5px;color:#a47720}.code{font-size:14px;font-weight:700;margin:9px 5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{color:#efc04e;font-size:16px;font-weight:800;margin:0 5px}.more{float:right;background:#24282c;border:0;color:#fff;border-radius:7px;width:31px;height:31px}.empty{padding:50px;text-align:center;color:#777}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.side{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}.logo{width:150px}.search{width:260px}}
@media(max-width:700px){.side{display:none}.main{margin-left:0;width:100%;padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.top{padding:0 12px}.logo{width:auto}.search{width:180px}.hero{flex-wrap:wrap}.actions{margin-left:0}.brandbox{width:130px}.top-right{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">ZiFY</div>
  <input id="search" class="search" placeholder="🔍  Mahsulot qidirish...">
  <div class="top-right"><span>☾</span><span>♧</span><span>◎ UZ⌄</span><div class="avatar">A</div><b>Admin⌄</b></div>
</header>
<div class="layout">
<aside class="side">
  <div class="nav">⌂ &nbsp; Bosh sahifa</div>
  <div class="nav">▣ &nbsp; Savdo</div>
  <div class="nav active">▣ &nbsp; Mahsulotlar　⌃</div>
  <div class="nav"><small>Barcha mahsulotlar</small><small>Kategoriya</small><small>Brendlar</small><small>Xususiyatlar</small><small>O‘lchov birliklari</small><small>Import / Export</small></div>
  <div class="nav">♙ &nbsp; Mijozlar</div>
  <div class="nav">♧ &nbsp; Yetkazib beruvchilar</div>
  <div class="nav">▣ &nbsp; Ombor</div>
  <div class="nav">⌁ &nbsp; Hisobotlar</div>
  <div class="nav">⚙ &nbsp; Sozlamalar</div>
</aside>
<main class="main">
  <div class="crumb">⌂ &nbsp; Mahsulotlar　›　<b>SALID</b></div>
  <section class="hero">
    <div class="brandbox">SALID<br><small style="font-size:10px">LIGHTING</small></div>
    <div><h1>SALID</h1><p>Yoritish mahsulotlari</p></div>
    <div class="actions"><button class="btn">✎ Tahrirlash</button><button class="btn danger">♜ O‘chirish</button></div>
  </section>
  <div id="cats" class="cats"></div>
  <div id="grid" class="grid"></div>
</main>
</div>
<script>
const imageMap={"SA54/2 WHI+FGD": "SA54_2_WHI_FGD.jpg", "SA54/3 WHI+FGD": "SA54_3_WHI_FGD.jpg", "SA55/2 YL+FG": "SA55_2_YL_FG.jpg", "SA55/3 YL+FG": "SA55_3_YL_FG.jpg", "SA62/2 CR": "SA62_2_CR.jpg", "SA62/3 CR": "SA62_3_CR.jpg", "SA62/5 CR": "SA62_5_CR.jpg", "SA68/2 FGD": "SA68_2_FGD.jpg", "SA68/3 FGD": "SA68_3_FGD.jpg", "SA68/5 FGD": "SA68_5_FGD.jpg", "SA71/5 BK+CH": "SA71_5_BK_CH.jpg", "SA74/2 BK+CR": "SA74_2_BK_CR.jpg", "SA74/3 BK+CR": "SA74_3_BK_CR.jpg", "SA76/3 BK+FG": "SA76_3_BK_FG.jpg", "SA76/5 BK+FG": "SA76_5_BK_FG.jpg", "SA83/3 CH": "SA83_3_CH.jpg", "SA85/2 BK+FG": "SA85_2_BK_FG.jpg", "SA85/3 BK+FG": "SA85_3_BK_FG.jpg", "SA75/4 BK+FG": "SA85_4_BK_FG.jpg", "SA89/2 CH": "SA89_2_CH.jpg", "SA89/3 CH": "SA89_3_CH.jpg", "SA12/2 WH+FG": "SA12_2_WH_FG.jpg", "SA12/3 WH+FG": "SA12_3_WH_FG.jpg", "SA12/5 WH+FG": "SA12_5_WH_FG.jpg"};
const products=[
["SA54/2 WHI+FGD","6,7","Lyustra"],["SA54/3 WHI+FGD","10","Lyustra"],["SA55/2 YL+FG","6,3","Lyustra"],["SA55/3 YL+FG","9,2","Lyustra"],
["SA62/2 CR","5,2","Lyustra"],["SA62/3 CR","7,7","Lyustra"],["SA62/5 CR","13,6","Lyustra"],["SA68/2 FGD","5,2","Lyustra"],
["SA68/3 FGD","7,7","Lyustra"],["SA68/5 FGD","13,6","Lyustra"],["SA71/5 BK+CH","14,1","Lyustra"],["SA74/2 BK+CR","6,5","Lyustra"],
["SA74/3 BK+CR","9,2","Lyustra"],["SA76/3 BK+FG","10,5","Lyustra"],["SA76/5 BK+FG","15,5","Lyustra"],["SA83/3 CH","13,1","Lyustra"],
["SA85/2 BK+FG","7","Lyustra"],["SA85/3 BK+FG","10,9","Lyustra"],["SA75/4 BK+FG","14","Lyustra"],["SA89/2 CH","5,7","Lyustra"],
["SA89/3 CH","8,3","Lyustra"],["SA12/2 WH+FG","5,7","Lyustra"],["SA12/3 WH+FG","8,3","Lyustra"],["SA12/5 WH+FG","14","Lyustra"],
["SG03-7","2,8","Galogen"],["SG07","3,2","Galogen"],["SG13","4,1","Galogen"],["SN01","5,5","Galogen"],["SS10","7,2","Galogen"],
["SH01","3,9","Shift chiroq"],["SH02","5,4","Shift chiroq"],["DP01","4,2","Devor chiroq"],["YO01","6,5","Yo‘l chiroq"],
["TR01","9,8","Trek chiroq"],["PN01","8,2","Panel"],["AK01","1,5","Aksessuar"]
];
const cats=["Barchasi",...new Set(products.map(x=>x[2]))];
let current="Barchasi";
const catsEl=document.getElementById("cats"), grid=document.getElementById("grid"), search=document.getElementById("search");
function renderCats(){catsEl.innerHTML=cats.map(c=>`<button class="cat ${c===current?'active':''}" onclick="setCat('${c.replaceAll("'","\\'")}')">${c}</button>`).join("")}
function render(){
 const q=search.value.toLowerCase();
 const arr=products.filter(p=>(current==="Barchasi"||p[2]===current)&&p[0].toLowerCase().includes(q));
 grid.innerHTML=arr.length?arr.map(p=>`<article class="card"><div class="pic"><img class="product-img" src="images/${imageMap[p[0]] || 'SA54_2_WHI_FGD.jpg'}" alt="${p[0]}" onerror="this.style.display='none'"></div><button class="more">⋮</button><div class="code">${p[0]}</div><div class="price">$${p[1]}</div></article>`).join(""):`<div class="empty">Mahsulot topilmadi</div>`;
}
function setCat(c){current=c;renderCats();render()}
search.oninput=render; renderCats(); render();
</script>
</body>
</html>
